name: PS Mobile APK
on:
  push:
    branches: [feature/ps-mobile-android]
    paths:
      - 'PSMobile/**'
      - '.github/workflows/ps-mobile-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PSMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include Android SDK; avoid the
      # setup-android sdkmanager license step that failed on this runner.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "Android SDK platform 35 unavailable on runner"
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools" || exit 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PS-Mobile-debug
          path: PSMobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
