name: PS Mobile APK
on:
  push:
    branches: [feature/ps-mobile-android]
    paths:
      - 'PSMobile/**'
      - '.github/workflows/ps-mobile-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PSMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PS-Mobile-debug
          path: PSMobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
